name: Load preview database

# Run by hand (Actions → Load preview database → Run workflow). Pushes every migration and the
# test seed (test logins, password Password-1234) to a SEPARATE preview Supabase project, and deploys
# the retention-purge function. It refuses to run against the live project.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PREVIEW_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.PREVIEW_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Refuse the live project
        run: |
          test -n "$PROJECT_REF" || { echo "Set the repository variable PREVIEW_PROJECT_REF"; exit 1; }
          test "$PROJECT_REF" != "lnagrfdbmwtlymhumepc" || { echo "This is the live project. Use a separate preview project."; exit 1; }
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - run: supabase db push --include-seed --password "$SUPABASE_DB_PASSWORD" --yes
      - run: supabase functions deploy retention-purge --project-ref "$PROJECT_REF"
